{% extends 'base/comet_layout.html' %}

{% block content %}
<article class="detail">
    <img class="detail-image" src="{{ service.image_url }}" alt="{{ service.name }}">
    <div class="detail-body">
        <h1>{{ service.name }}</h1>
        <div class="detail-meta"></div>
        <p class="desc">{{ service.description }}</p>

        <div class="non-grav">
            <strong>Негравитационные параметры:</strong>
            <ul>
                {% for p in service.non_grav_params %}
                <li>{{ p }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="nav-links">
            <a class="btn btn-red" href="{% url 'services:order_detail' order_id %}">к заявке →</a>
        </div>

    </div>

</article>
{% endblock %}
